<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Calculator Screen Card -->
  <rect x="76" y="80" width="360" height="110" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="112" cy="115" r="8" fill="#ff9500"/>
  <rect x="230" y="130" width="170" height="24" rx="8" fill="#ffffff" opacity="0.9"/>

  <!-- Keypad Button Dots / Symbols -->
  <!-- Row 1 -->
  <circle cx="130" cy="255" r="38" fill="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <text x="130" y="265" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ff9500" text-anchor="middle">AC</text>

  <circle cx="256" cy="255" r="38" fill="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <text x="256" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ff9500" text-anchor="middle">%</text>

  <circle cx="382" cy="255" r="38" fill="rgba(255,255,255,0.12)" filter="url(#shadow)"/>
  <text x="382" y="266" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <circle cx="130" cy="365" r="38" fill="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <text x="130" y="377" font-family="sans-serif" font-size="34" font-weight="500" fill="#ffffff" text-anchor="middle">7</text>

  <circle cx="256" cy="365" r="38" fill="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <text x="256" y="377" font-family="sans-serif" font-size="34" font-weight="500" fill="#ffffff" text-anchor="middle">8</text>

  <circle cx="382" cy="365" r="38" fill="url(#orangeGlow)" filter="url(#shadow)"/>
  <text x="382" y="377" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
</svg>
